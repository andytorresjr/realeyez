name: Feature request
description: Request a product or engineering enhancement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem are we solving?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: principle
    attributes:
      label: Does this preserve capture-only principle?
      options:
        - yes
        - no
    validations:
      required: true
